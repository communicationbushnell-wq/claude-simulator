<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test Tactics Simulator</title>
<meta name="description" content="A timed practice college exam that coaches twelve research-rated test-taking tactics and debriefs which ones each student used.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..800&family=Archivo+Narrow:wght@500..700&family=IBM+Plex+Mono:wght@500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..600&display=swap">
<style>
[hidden]{display:none!important}
:root{
  /* Layout: one exam sheet on a cool desk. A proctor bar with the clock pins to the top; coaching sits in the sheet's right margin in purple pen and drops below the item on phones. */
  --desk:#E7EBF0;
  --sheet:#FFFFFF;
  --sheet-2:#F5F7FA;
  --ink:#16202D;
  --ink-2:#465264;
  --ink-3:#6B7586;
  --rule:#D3DAE3;
  --rule-2:#E5EAF0;
  --ruling:#C9D6EE;
  --blue:#1E45A4;
  --blue-ink:#FFFFFF;
  --blue-soft:#E3EAF9;
  --blue-line:#97AEE2;
  --pen:#5A3A9F;
  --pen-soft:#F2EDFB;
  --pen-line:#CDBEF0;
  --hl:#FFE45E;
  --hl-ink:#16202D;
  --graphite:#262A31;
  --graphite-ink:#FFFFFF;
  --ok:#126B4A;
  --ok-soft:#E0F2E9;
  --bad:#AA2A21;
  --bad-soft:#FBE6E3;
  --warn:#8A5200;
  --warn-soft:#FFEFD2;
  --s1:#1E45A4;
  --s2:#2A8A80;
  --s3:#A8721A;
  --s4:#5A3A9F;
  --shadow:0 1px 0 rgba(22,32,45,.05),0 8px 24px -14px rgba(22,32,45,.35);
  --f-display:'Archivo Narrow','Arial Narrow','Roboto Condensed',sans-serif;
  --f-ui:'Archivo',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-exam:'Source Serif 4','Source Serif Pro',Georgia,'Times New Roman',serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --desk:#0E131A;--sheet:#161D27;--sheet-2:#1B2330;--ink:#E6EBF2;--ink-2:#AAB4C3;--ink-3:#8590A1;
    --rule:#2B3543;--rule-2:#222B37;--ruling:#2A3756;
    --blue:#8DADFF;--blue-ink:#0B1424;--blue-soft:#1B2945;--blue-line:#3D5A9E;
    --pen:#BEA9F6;--pen-soft:#221B36;--pen-line:#4B3C7A;
    --hl:#E3C53A;--hl-ink:#15120A;--graphite:#DCE2EB;--graphite-ink:#111720;
    --ok:#62D2A2;--ok-soft:#11281E;--bad:#FF8E84;--bad-soft:#321715;--warn:#F2B75C;--warn-soft:#2C2010;
    --s1:#8DADFF;--s2:#5FC6BA;--s3:#E1B263;--s4:#BEA9F6;
    --shadow:0 1px 0 rgba(0,0,0,.35),0 10px 30px -16px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --desk:#0E131A;--sheet:#161D27;--sheet-2:#1B2330;--ink:#E6EBF2;--ink-2:#AAB4C3;--ink-3:#8590A1;
  --rule:#2B3543;--rule-2:#222B37;--ruling:#2A3756;
  --blue:#8DADFF;--blue-ink:#0B1424;--blue-soft:#1B2945;--blue-line:#3D5A9E;
  --pen:#BEA9F6;--pen-soft:#221B36;--pen-line:#4B3C7A;
  --hl:#E3C53A;--hl-ink:#15120A;--graphite:#DCE2EB;--graphite-ink:#111720;
  --ok:#62D2A2;--ok-soft:#11281E;--bad:#FF8E84;--bad-soft:#321715;--warn:#F2B75C;--warn-soft:#2C2010;
  --s1:#8DADFF;--s2:#5FC6BA;--s3:#E1B263;--s4:#BEA9F6;
  --shadow:0 1px 0 rgba(0,0,0,.35),0 10px 30px -16px rgba(0,0,0,.8);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--sheet)}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
a{color:var(--blue);text-underline-offset:2px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.small{font-size:14px}
.min0{min-width:0}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap.narrow{max-width:820px}

.eyebrow{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.09em;font-size:13px;font-weight:600;color:var(--ink-2)}
.h-page{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,4.6vw,44px);line-height:1.05;letter-spacing:-.005em}
.h-sheet{font-family:var(--f-display);font-weight:700;font-size:clamp(24px,3.4vw,32px);line-height:1.1}
.h-sec{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.15}
.h-sub{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1.2}

.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:4px;box-shadow:var(--shadow)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:var(--r);border:1px solid var(--rule);background:var(--sheet);color:var(--ink);font-weight:600;font-size:15px;line-height:1.2;cursor:pointer;text-decoration:none;text-align:center}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--blue);padding:0 10px}
.btn.ghost:hover{border-color:var(--rule)}
.btn.small{min-height:36px;padding:0 12px;font-size:14px}
.btn.big{min-height:52px;padding:0 24px;font-size:16px}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn svg{flex:none}
.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:flex-end}

/* answer-sheet bubble */
.bubble{display:inline-grid;place-items:center;flex:none;width:32px;height:22px;border-radius:50%;border:1.5px solid var(--ink-2);background:var(--sheet);font-family:var(--f-display);font-weight:700;font-size:13px;line-height:1;color:var(--ink-2)}
.bubble.on,.is-sel .bubble{background:var(--graphite);border-color:var(--graphite);color:var(--graphite-ink)}
.bubble.dot{width:22px;height:22px}

/* badges & chips */
.badge{display:inline-block;font-family:var(--f-display);font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:2px 8px;border-radius:3px;border:1px solid var(--rule);color:var(--ink-2);white-space:nowrap;line-height:1.5}
.badge.strong{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.badge.moderate{color:var(--blue);border-color:var(--blue-line);background:var(--blue-soft)}
.badge.mixed{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
.badge.logic{color:var(--ink);border-color:var(--ink-3);background:var(--sheet-2)}
.badge.limited{color:var(--ink-3);border-style:dashed}
.chip{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid transparent;white-space:nowrap;line-height:1.4}
.chip.used{color:var(--ok);background:var(--ok-soft)}
.chip.partial{color:var(--warn);background:var(--warn-soft)}
.chip.missed{color:var(--bad);background:var(--bad-soft)}
.chip.na{color:var(--ink-3);border-color:var(--rule)}

/* forms */
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{padding:0}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer;line-height:1.45}
.check input{accent-color:var(--blue);width:18px;height:18px;margin:2px 0 0;flex:none}
textarea{display:block;width:100%;font-family:var(--f-exam);font-size:17px;line-height:1.6;padding:12px 14px;border:1px solid var(--rule);border-radius:var(--r);background:var(--sheet);color:var(--ink);resize:vertical}
textarea:focus{border-color:var(--blue-line)}
textarea::placeholder{color:var(--ink-3)}

/* ---------- HOME ---------- */
.home{padding-block:40px 72px;display:grid;gap:48px}
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:44px;align-items:start}
.hero-main{display:grid;gap:20px;min-width:0}
.hero h1{font-family:var(--f-display);font-weight:700;font-size:clamp(42px,6.6vw,72px);line-height:.94;letter-spacing:-.01em;text-transform:uppercase}
.lede{font-family:var(--f-exam);font-size:19px;line-height:1.55;color:var(--ink-2);max-width:60ch}
.setup{padding:24px;display:grid;gap:22px}
.setup legend{margin-bottom:10px}
.mode-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode-card{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;cursor:pointer;background:var(--sheet)}
.mode-card input{position:absolute;opacity:0;width:1px;height:1px}
.mode-card .bubble{grid-row:1/3;margin-top:1px}
.mode-card.on{border-color:var(--blue);background:var(--blue-soft)}
.mode-card:focus-within{outline:2px solid var(--blue);outline-offset:2px}
.mc-title{font-weight:700;font-size:16px}
.mc-desc{font-size:14px;color:var(--ink-2);line-height:1.45}
.segopts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));max-width:400px;border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.segopt{position:relative;padding:0 8px;min-height:42px;display:flex;align-items:center;justify-content:center;white-space:nowrap;font-weight:600;font-size:15px;cursor:pointer;border-right:1px solid var(--rule);font-variant-numeric:tabular-nums}
.segopt:last-child{border-right:0}
.segopt.on{background:var(--ink);color:var(--sheet)}
.segopt:focus-within{outline:2px solid var(--blue);outline-offset:-3px}
.fine{font-size:13.5px;color:var(--ink-2);margin-top:8px}
.setup-go{display:grid;gap:8px;justify-items:start}
.resume{padding:16px 18px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;border-color:var(--blue-line)}
.resume-acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.specimen{margin:0;display:grid;gap:14px;align-content:start;padding-top:10px}
.spec-sheet{overflow:hidden}
.spec-body{padding:18px 20px 20px;display:grid;gap:14px}
.spec-opts{display:grid;gap:6px}
.sopt{display:flex;align-items:center;gap:12px;padding:7px 10px;border:1px solid var(--rule-2);border-radius:var(--r);font-family:var(--f-exam);font-size:16px}
.sopt.is-elim span:last-child{text-decoration:line-through;text-decoration-thickness:2px;color:var(--ink-3)}
.sopt.is-elim .bubble{border-style:dashed;opacity:.6}
.sopt.is-sel{border-color:var(--ink-2);background:var(--sheet-2)}
.spec-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}
.mini-seg{display:inline-flex;border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.mini-seg b{font-weight:600;padding:3px 9px;border-right:1px solid var(--rule)}
.mini-seg b:last-child{border-right:0}
.mini-seg b.on{background:var(--ink);color:var(--sheet)}
.mini-flag{display:inline-flex;align-items:center;gap:5px;color:var(--pen);font-weight:600;border:1px solid var(--pen-line);background:var(--pen-soft);border-radius:4px;padding:3px 9px}
.spec-cap{font-size:13px;color:var(--ink-2);display:flex;gap:6px 16px;flex-wrap:wrap}
.spec-cap span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ink-3);margin-right:6px;vertical-align:1px}

.tindex{display:grid;gap:18px}
.tindex-head{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:baseline;justify-content:space-between}
.tlist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 36px}
.tlist li{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:2px 10px;padding:12px 0;border-top:1px solid var(--rule);align-items:baseline}
.tnum{font-family:var(--f-display);font-weight:700;font-size:18px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.tname{font-weight:700}
.tshort{grid-column:2/4;font-size:14px;color:var(--ink-2)}
.tablewrap{overflow-x:auto}
table.hist{width:100%;border-collapse:collapse;font-size:14.5px;font-variant-numeric:tabular-nums;min-width:560px}
table.hist th{text-align:left;font-family:var(--f-display);text-transform:uppercase;letter-spacing:.07em;font-size:12px;color:var(--ink-2);padding:8px 10px;border-bottom:1px solid var(--rule)}
table.hist td{padding:9px 10px;border-bottom:1px solid var(--rule-2)}

/* ---------- PROCTOR BAR ---------- */
.proctor{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sheet);border-bottom:1px solid var(--rule)}
.proctor-in{display:flex;align-items:center;flex-wrap:wrap;gap:8px 22px;min-height:62px;padding-block:8px}
.pb-id{display:grid;gap:0;min-width:0}
.pb-course{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;font-size:13px;font-weight:700}
.pb-mode{font-size:13px;color:var(--ink-2)}
.pb-mode.coached{color:var(--pen)}
.pb-clock{display:flex;align-items:baseline;gap:8px}
.pb-time{font-family:var(--f-mono);font-size:28px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.pb-time.low{color:var(--bad)}
.pb-of{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.pace{flex:1 1 200px;min-width:0;display:grid;gap:5px}
.pace-top{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.pace-label{font-weight:600;color:var(--ink-2)}
.pace-text{color:var(--ink-2);font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.pace-bar{height:7px;border-radius:4px;background:var(--rule-2);position:relative;overflow:hidden}
.pace-fill{position:absolute;inset:0 auto 0 0;background:var(--blue);border-radius:4px}
.pace-fill.over{background:var(--warn)}
.pb-actions{display:flex;gap:8px;margin-left:auto}
@media (max-width:640px){
  .pb-id{display:none}
  .proctor-in{gap:6px 14px}
  .pb-time{font-size:24px}
  .pace{order:3;flex-basis:100%}
}

.pausecover{position:fixed;inset:0;z-index:15;background:var(--desk);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.pause-card{max-width:440px;padding:28px;display:grid;gap:14px;text-align:center;justify-items:center}

/* ---------- SHARED LAYOUTS ---------- */
.two-col{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
.one-col{display:grid;grid-template-columns:minmax(0,860px);justify-content:center;gap:24px}
.stack-col{display:grid;gap:24px;min-width:0}
@media (max-width:980px){.two-col{grid-template-columns:minmax(0,1fr)}}
.page-pad{padding-block:24px 64px;display:grid;gap:20px}

/* margin notes (purple pen) */
.margin{display:grid;gap:12px;align-content:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px)}
@media (max-width:980px){.margin{position:static}}
.note{background:var(--pen-soft);border:1px solid var(--pen-line);border-radius:4px;padding:13px 15px;display:grid;gap:7px}
.note-label{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.09em;font-size:12px;font-weight:700;color:var(--pen)}
.note-text{font-family:var(--f-exam);font-style:italic;font-size:16.5px;line-height:1.5;color:var(--pen)}
.note.warnnote{background:var(--warn-soft);border-color:var(--warn)}
.note.warnnote .note-label,.note.warnnote .note-text{color:var(--warn)}
.steps{display:flex;flex-wrap:wrap;gap:6px;list-style:none;padding:0;margin:3px 0 0}
.steps li{font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid var(--pen-line);color:var(--pen);background:var(--sheet)}
.steps li.done{background:var(--pen);color:var(--sheet);border-color:var(--pen)}
.why{border:1px solid var(--rule);border-radius:4px;background:var(--sheet);font-size:14px}
.why summary{cursor:pointer;padding:10px 13px;font-weight:600;color:var(--ink-2);list-style-position:inside}
.why[open] summary{border-bottom:1px solid var(--rule-2)}
.why p{padding:10px 13px 0;line-height:1.5}
.why .why-foot{display:flex;gap:10px;align-items:center;padding-bottom:12px}

/* ---------- RESET ---------- */
.reset-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:760px){.reset-grid{grid-template-columns:1fr}}
.rcard{padding:20px 22px;display:grid;gap:12px;align-content:start}
.exam-text{font-family:var(--f-exam);font-size:17.5px;line-height:1.6}
.rtimer{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.rtimer .mono{font-size:18px;font-weight:600}
.evid{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:14.5px;color:var(--ink-2)}

/* ---------- COVER ---------- */
.cover{padding:30px 34px 34px;display:grid;gap:22px}
@media (max-width:560px){.cover{padding:22px 18px}}
.cover-top{display:flex;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:10px;font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;font-weight:700;font-size:13px}
.cover h1{font-family:var(--f-exam);font-weight:700;font-size:clamp(26px,4vw,34px);line-height:1.15}
.cover-meta{display:flex;gap:6px 28px;flex-wrap:wrap;font-family:var(--f-mono);font-size:14px;color:var(--ink-2)}
.dir{display:grid;gap:6px;font-family:var(--f-exam);font-size:17.5px;line-height:1.6}
.dir h2{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.07em;font-size:15px;font-weight:700;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--rule);padding-bottom:4px}
.dir h2 .pts{font-family:var(--f-mono);text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink-2);font-size:14px}
.dir ol{margin:0;padding-left:22px;display:grid;gap:4px}
.line{border-radius:3px;padding:1px 3px;margin:0 -3px;transition:background .2s}
.line.pointer{background:var(--pen-soft);box-shadow:inset 0 -2px 0 var(--pen)}
.cover-foot{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;font-size:13px;font-weight:600;color:var(--ink-2);border-top:2px solid var(--ink);padding-top:10px}

.iq-sec{padding:22px 24px;display:grid;gap:10px}
.iq-list{list-style:none;margin:0;padding:0;counter-reset:iq}
.iq{display:grid;gap:9px;padding:14px 0;border-top:1px solid var(--rule-2);counter-increment:iq}
.iq-q{font-weight:600}
.iq-q::before{content:counter(iq) ". ";color:var(--ink-3)}
.iq-opts{display:flex;flex-wrap:wrap;gap:8px}
.iq-opt{border:1px solid var(--rule);background:var(--sheet);border-radius:var(--r);padding:8px 13px;cursor:pointer;text-align:left;font-size:15px;min-height:40px;line-height:1.35}
.iq-opt:hover{border-color:var(--ink-3)}
.iq-opt.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);font-weight:600}
.iq-opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.fb{font-size:14.5px;line-height:1.45}
.fb.ok{color:var(--ok)}
.fb.bad{color:var(--bad)}
.fb.warn{color:var(--warn)}
.fb.info{color:var(--ink-2)}

/* ---------- PLAN ---------- */
.plan-sheet{padding:24px 28px;display:grid;gap:20px}
@media (max-width:560px){.plan-sheet{padding:20px 16px}}
table.struct{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.struct th{text-align:left;font-family:var(--f-display);text-transform:uppercase;letter-spacing:.07em;font-size:12px;color:var(--ink-2);padding:6px 8px;border-bottom:1px solid var(--rule)}
table.struct td{padding:9px 8px;border-bottom:1px solid var(--rule-2)}
table.struct td.n,table.struct th.n{text-align:right}
.plan-inputs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:640px){.plan-inputs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.num{display:grid;gap:6px}
.num label{font-weight:600;font-size:14px}
.num input{width:100%;min-height:46px;font-family:var(--f-mono);font-size:20px;padding:0 10px;border:1px solid var(--rule);border-radius:var(--r);background:var(--sheet);color:var(--ink)}
.num .unit{font-size:12.5px;color:var(--ink-3)}
.fb-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.share{display:grid;gap:8px;margin-top:6px}
.share-row{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;align-items:center;font-size:13px;color:var(--ink-2)}
.stack{display:flex;height:16px;border-radius:3px;overflow:hidden;background:var(--rule-2)}
.stack span{display:block;height:100%;border-right:2px solid var(--sheet)}
.stack span:last-child{border-right:0}
.seg-p1,.k-p1{background:var(--s1)}
.seg-p2,.k-p2{background:var(--s2)}
.seg-p3,.k-p3{background:var(--s3)}
.seg-review,.k-review{background:var(--s4)}
.share-key,.tkey{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink-2);padding-left:86px}
.share-key i,.tkey i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
@media (max-width:560px){.share-key,.tkey{padding-left:0}}

/* ---------- EXAM ---------- */
.navi{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:flex-end;padding-block:18px 10px}
.navi-part{display:grid;gap:6px}
.navi-label{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;font-size:12px;font-weight:700;color:var(--ink-2)}
.navi-cells,.jump{display:flex;gap:5px;flex-wrap:wrap}
.cell{position:relative;min-width:34px;height:34px;padding:0 6px;border:1px solid var(--rule);border-radius:3px;background:var(--sheet);font-family:var(--f-display);font-weight:700;font-size:14px;cursor:pointer;color:var(--ink-2);font-variant-numeric:tabular-nums}
.cell:hover{border-color:var(--ink-3)}
.cell.done{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.cell.flag::after{content:"";position:absolute;top:-1px;right:-1px;border-style:solid;border-width:0 11px 11px 0;border-color:transparent var(--pen) transparent transparent}
.cell.cur{outline:2px solid var(--blue);outline-offset:2px}
.navi-extra{display:flex;gap:6px;align-items:center;margin-left:auto}
.navi-legend{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3);width:100%}
.navi-legend span{display:inline-flex;align-items:center;gap:6px}
.lg{display:inline-block;width:12px;height:12px;border:1px solid var(--rule);border-radius:2px;background:var(--sheet);position:relative}
.lg.done{background:var(--ink);border-color:var(--ink)}
.lg.flag::after{content:"";position:absolute;top:-1px;right:-1px;border-style:solid;border-width:0 6px 6px 0;border-color:transparent var(--pen) transparent transparent}

.exam-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start;padding-block:6px 48px}
.exam-grid.solo{grid-template-columns:minmax(0,840px);justify-content:center}
@media (max-width:980px){.exam-grid{grid-template-columns:minmax(0,1fr)}}
.exam-main{display:grid;gap:14px;min-width:0}
.item-head{display:flex;justify-content:space-between;gap:12px;padding:11px 20px;border-bottom:1px solid var(--rule-2);font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.item-body{display:grid;grid-template-columns:58px minmax(0,1fr);gap:0 10px;padding:24px 26px 26px 12px}
.item-num{font-family:var(--f-display);font-weight:700;font-size:30px;text-align:right;line-height:1.15;font-variant-numeric:tabular-nums}
.item-main{min-width:0}
@media (max-width:560px){
  .item-body{grid-template-columns:minmax(0,1fr);padding:16px 16px 20px}
  .item-num{text-align:left;font-size:24px;margin-bottom:4px}
}
.stem{font-family:var(--f-exam);font-size:19px;line-height:1.6}
.w{cursor:pointer;border-radius:2px;padding:0 1px;margin:0 -1px;-webkit-tap-highlight-color:transparent}
.w:hover{background:var(--rule-2)}
.w.hl{background:linear-gradient(transparent 10%,var(--hl) 10%,var(--hl) 90%,transparent 90%);color:var(--hl-ink)}
.hint{font-size:13px;color:var(--ink-3);margin-top:6px}
.opts{display:grid;gap:8px;margin-top:18px}
.opt{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px;border:1px solid var(--rule-2);border-radius:var(--r);background:var(--sheet)}
.opt:hover{border-color:var(--rule)}
.opt.is-sel{border-color:var(--ink-2);background:var(--sheet-2)}
.opt-pick{display:flex;align-items:flex-start;gap:13px;padding:12px 14px;cursor:pointer;min-width:0}
.opt-pick input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.opt-pick .bubble{margin-top:2px}
.opt-pick input:focus-visible + .bubble{outline:2px solid var(--blue);outline-offset:2px}
.opt-text{font-family:var(--f-exam);font-size:17px;line-height:1.5;min-width:0}
.opt.is-elim .opt-text{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--ink-3);color:var(--ink-3)}
.opt.is-elim .bubble{border-style:dashed;opacity:.6}
.strike{margin-right:8px;min-height:34px;padding:0 10px;border:1px solid transparent;border-radius:4px;background:transparent;color:var(--ink-3);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.strike:hover{color:var(--ink);border-color:var(--rule)}
.strike[aria-pressed="true"]{color:var(--ink);border-color:var(--rule);background:var(--sheet-2)}
.opts.tf{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:420px){.opts.tf{grid-template-columns:1fr}}
.tools{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;justify-content:space-between;margin-top:20px;padding-top:16px;border-top:1px dashed var(--rule)}
.conf{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tools-label{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;font-size:12px;font-weight:700;color:var(--ink-2)}
.segbtns{display:inline-flex;border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.segbtns button{border:0;border-right:1px solid var(--rule);background:var(--sheet);padding:0 13px;min-height:38px;font-size:14px;font-weight:600;cursor:pointer}
.segbtns button:last-child{border-right:0}
.segbtns button:hover{background:var(--sheet-2)}
.segbtns button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.tools-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.flagbtn[aria-pressed="true"]{color:var(--pen);border-color:var(--pen-line);background:var(--pen-soft)}
.item-nav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* essay */
.essay-body{padding:22px 26px 26px;display:grid;gap:14px}

.essay-rule{font-size:15px;color:var(--ink-2)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.tab{border:1px solid transparent;border-bottom:0;background:transparent;padding:9px 16px;font-weight:600;cursor:pointer;border-radius:4px 4px 0 0;margin-bottom:-1px;color:var(--ink-2)}

.prompt-panel{display:grid;gap:14px;padding-top:4px}
.step-label{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;font-size:12.5px;font-weight:700;color:var(--pen)}
.field-label{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.prompt{font-family:var(--f-exam);font-size:19px;line-height:1.75}
.tok{font:inherit;line-height:inherit;border:1.5px solid transparent;background:transparent;padding:0 3px;margin:0 -3px;border-radius:999px;cursor:pointer;color:inherit;display:inline}
.tok:hover{background:var(--rule-2)}
.tok.on{border-color:var(--pen);color:var(--pen)}
.tok.found{border-color:var(--ok);color:var(--ok)}
.tok.missed{border-color:var(--warn);border-style:dashed}

.verbcheck{display:grid;gap:10px}
.gloss{display:grid;gap:6px;margin:0}
.gloss div{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;font-size:14.5px}
.gloss dt{font-weight:700}
.gloss dd{margin:0;color:var(--ink-2)}
.tasks{display:grid;gap:8px;padding:14px 16px;border:1px solid var(--pen-line);border-radius:4px;background:var(--pen-soft)}
.tasks legend{float:left;width:100%;margin-bottom:6px}
.tasks .check{font-size:15px}
.field{display:grid;gap:6px}
.wc{font-size:12.5px;color:var(--ink-3);justify-self:end;font-variant-numeric:tabular-nums}
textarea.bluebook{background-color:var(--sheet);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(1.6em - 1px),var(--ruling) calc(1.6em - 1px),var(--ruling) 1.6em);background-attachment:local;background-position:0 12px;min-height:280px}

/* review */
.review{padding:26px 28px;display:grid;gap:16px}
@media (max-width:560px){.review{padding:20px 16px}}
.rv-list{list-style:none;margin:0;padding:0}
.rv{display:grid;grid-template-columns:26px minmax(0,1fr);gap:4px 12px;padding:14px 0;border-top:1px solid var(--rule-2)}
.rv-mark{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;margin-top:1px}
.rv.ok .rv-mark{background:var(--ok-soft);color:var(--ok)}
.rv.warn .rv-mark{background:var(--warn-soft);color:var(--warn)}
.rv-title{font-weight:700}
.rv-body{font-size:14.5px;color:var(--ink-2);margin-top:2px}
.rv .jump{margin-top:8px}
.confirm{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:flex-end;padding:14px 16px;border:1px solid var(--blue-line);border-radius:var(--r);background:var(--blue-soft)}
.confirm p{margin-right:auto;font-weight:600}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,24px);opacity:0;pointer-events:none;width:min(560px,calc(100vw - 32px));z-index:40;background:var(--sheet);border:1px solid var(--rule);border-radius:6px;box-shadow:var(--shadow);padding:12px 14px;display:flex;gap:12px;align-items:flex-start;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast.coach{border-color:var(--pen-line);background:var(--pen-soft)}
.toast.warn{border-color:var(--warn);background:var(--warn-soft)}
.toast-body{flex:1;min-width:0;display:grid;gap:2px}
.toast-label{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.09em;font-size:11.5px;font-weight:700;color:var(--ink-2)}
.toast.coach .toast-label,.toast.coach .toast-msg{color:var(--pen)}
.toast.warn .toast-label,.toast.warn .toast-msg{color:var(--warn)}
.toast-msg{font-size:15px;line-height:1.45}
.toast-x{border:0;background:transparent;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink-2);padding:4px 6px;border-radius:4px}

/* ---------- RESULTS ---------- */
.res{padding-block:28px 72px;display:grid;gap:22px}
.res-head{padding:24px 28px;display:grid;gap:16px}
@media (max-width:560px){.res-head{padding:20px 16px}}
.banner{padding:10px 14px;border-radius:4px;font-weight:600;font-size:14.5px}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.score-row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px 40px;align-items:end}
@media (max-width:760px){.score-row{grid-template-columns:minmax(0,1fr)}}
.score-main{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score-big{font-family:var(--f-display);font-weight:700;font-size:clamp(56px,10vw,92px);line-height:.9;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.score-of{font-family:var(--f-display);font-size:22px;font-weight:600;color:var(--ink-2)}
.part-scores{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 18px;margin:0}
@media (max-width:640px){.part-scores{grid-template-columns:repeat(2,minmax(0,1fr))}}
.part-scores div{border-top:2px solid var(--ink);padding-top:8px;min-width:0}
.part-scores dt{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;font-size:12px;font-weight:700;color:var(--ink-2)}
.part-scores dd{margin:2px 0 0;font-family:var(--f-mono);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.part-scores dd.sub{font-family:var(--f-ui);font-size:13px;font-weight:400;color:var(--ink-2)}
.res-acts{display:flex;flex-wrap:wrap;gap:10px}
.res-sec{padding:24px 28px;display:grid;gap:14px}
@media (max-width:560px){.res-sec{padding:20px 16px}}
.tr-list{display:grid}
.tr{display:grid;grid-template-columns:minmax(0,240px) 104px minmax(0,1fr);gap:6px 16px;padding:13px 0;border-top:1px solid var(--rule-2);align-items:baseline}
.tr-name{display:flex;gap:10px;align-items:baseline;font-weight:700}
.tr-name .tnum{font-size:16px;min-width:20px}
.tr-obs{font-size:15px;color:var(--ink-2);line-height:1.5}
@media (max-width:760px){.tr{grid-template-columns:minmax(0,1fr) auto}.tr-obs{grid-column:1/-1}}
.two-sec{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
@media (max-width:860px){.two-sec{grid-template-columns:minmax(0,1fr)}}
.tchart{display:grid;gap:12px}
.trow{display:grid;grid-template-columns:150px minmax(0,1fr) 112px;gap:12px;align-items:center;font-size:14px}
@media (max-width:560px){.trow{grid-template-columns:96px minmax(0,1fr) 92px;font-size:13px}}
.tbars{display:grid;gap:3px;min-width:0}
.tbar{display:block;height:10px;border-radius:2px;background:var(--s1);min-width:2px}
.tbar.plan{background:transparent;border:1.5px dashed var(--blue-line);height:10px}
.tbar.over{background:var(--warn)}
.tval{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px}
.tkey{padding-left:162px}
.k-act{background:var(--s1)}
.k-over{background:var(--warn)}
.k-plan{background:transparent;border:1.5px dashed var(--blue-line)}
.calib{display:grid;gap:10px}
.crow{display:grid;grid-template-columns:70px minmax(0,1fr) 92px;gap:12px;align-items:center;font-size:14px}
.cbar{height:12px;border-radius:2px;background:var(--rule-2);overflow:hidden}
.cbar span{display:block;height:100%;background:var(--s2)}
.cval{text-align:right;font-family:var(--f-mono);font-size:13px}
.chg{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.chg li{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:14.5px}
.research-line{font-size:14px;color:var(--ink-2);border-top:1px solid var(--rule-2);padding-top:10px}
.es-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:24px}
@media (max-width:860px){.es-grid{grid-template-columns:minmax(0,1fr)}}
.es-text,.es-rubric{display:grid;gap:10px;align-content:start}
.es-prompt{font-family:var(--f-exam);font-size:16.5px;line-height:1.55}
.es-box{border:1px solid var(--rule);border-radius:4px;padding:12px 14px;font-family:var(--f-exam);font-size:16px;line-height:1.6;max-height:360px;overflow:auto;display:grid;gap:8px;background:var(--sheet-2);overflow-wrap:anywhere}
.rub{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;padding:9px 0;border-top:1px solid var(--rule-2);font-size:14.5px}
.rub b{font-size:14px}
.es-total{font-size:16px}
.es-total b{font-size:20px}
.model{border:1px solid var(--rule);border-radius:4px}
.model summary{cursor:pointer;padding:9px 12px;font-weight:600}
.model ul{margin:0;padding:4px 14px 12px 32px;display:grid;gap:6px;font-size:14.5px}
.ir-list{display:grid}
.ir{display:grid;grid-template-columns:40px minmax(0,1fr);gap:4px 12px;padding:14px 0;border-top:1px solid var(--rule-2)}
.ir-num{font-family:var(--f-display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.ir-main{display:grid;gap:8px;min-width:0}
.ir-stem{font-family:var(--f-exam);font-size:16.5px;line-height:1.5}
.ir-opts{margin:0;padding-left:24px;display:grid;gap:2px;font-size:14.5px;color:var(--ink-2)}
.ir-opts li.key{color:var(--ok);font-weight:600}
.ir-opts li.mine:not(.key){color:var(--bad);text-decoration:line-through}
.ir-meta{display:flex;gap:6px 12px;flex-wrap:wrap;align-items:baseline;font-size:14px}
.ir details summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--blue)}
.ir details p{font-size:14.5px;line-height:1.55;margin-top:6px}
.part-h{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;font-size:13px;font-weight:700;color:var(--ink-2);padding-top:10px}
.copybox{display:grid;gap:8px}
.copybox textarea{font-family:var(--f-mono);font-size:12.5px;line-height:1.5;min-height:200px}

/* ---------- LIBRARY ---------- */
.lib{padding-block:32px 72px;display:grid;gap:28px}
.lib-head{display:grid;gap:14px}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 18px;font-size:14px;color:var(--ink-2)}
.legend div{display:grid;gap:4px;align-content:start}
.legend .badge{justify-self:start}
.tcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:820px){.tcards{grid-template-columns:minmax(0,1fr)}}
.tcard{padding:20px 22px;display:grid;gap:10px;align-content:start;scroll-margin-top:96px}
.tcard.flash{border-color:var(--pen)}
.tcard-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tcard h3{font-family:var(--f-display);font-size:22px;font-weight:700;line-height:1.15}
.tc-p{font-size:15px;line-height:1.55}
.tc-label{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;font-size:12px;font-weight:700;color:var(--ink-2);margin-right:6px}
.src{margin:0;padding-left:18px;display:grid;gap:5px;font-size:13.5px;color:var(--ink-2);line-height:1.45;overflow-wrap:anywhere}
.lib-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:820px){.lib-two{grid-template-columns:minmax(0,1fr)}}
.myths{padding:22px 24px;display:grid;gap:12px;align-content:start}
.myth{display:grid;gap:4px;padding-top:12px;border-top:1px solid var(--rule-2)}
.myth b{font-family:var(--f-exam);font-size:17px}
.myth p{font-size:14.5px;color:var(--ink-2);line-height:1.5}
.glossary{display:grid;gap:0;margin:0}
.glossary div{display:grid;grid-template-columns:100px minmax(0,1fr);gap:12px;padding:8px 0;border-top:1px solid var(--rule-2);font-size:14.5px}
.glossary dt{font-weight:700}
.glossary dd{margin:0;color:var(--ink-2)}

@media (max-width:900px){.hero{grid-template-columns:minmax(0,1fr)}.tlist{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.mode-cards{grid-template-columns:minmax(0,1fr)}.setup{padding:18px 16px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>

<body>
<div id="proctor" class="proctor" hidden></div>
<main id="view"></main>
<div id="pausecover" class="pausecover" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ================= helpers ================= */
const $ = (s, r) => (r || document).querySelector(s);

/* ================= clock ================= */
let timer = null, lastNow = 0;
function phaseKey() {

  if (S.view === 'cover') return 'cover';

}
function accumulate() {
  const A = S.A;

  const now = performance.now();
  let d = now - lastNow;
  lastNow = now;
  if (!(d > 0)) d = 0;
  A.elapsed += d;
  const k = phaseKey();
  if (k) A.phase[k] += d;
}
function startClock() {
  const A = S.A;
  if (!A || A.running || A.submitted) return;
  A.running = true;

/* ================= analysis ================= */
function itemPoints(i, a) {
  if (a == null) return 0;
  if (i.type === 'mc') return a === i.key ? 2 : 0;
  return a === i.key ? 1 : -0.5;
}
function hasText(ps) { return wc(ps.answer) + wc(ps.outline) > 0; }
function gradedPrompt(A) {
  const e = A.essay, f = e.startedFirst;
  if (!f) return null;
  const o = f === 'A' ? 'B' : 'A';
  if (hasText(e[f])) return f;
  if (hasText(e[o])) return o;
  return null;
}
function ansLabel(i, a) { if (a == null) return 'Blank'; return i.type === 'mc' ? 'ABCD'[a] : (a ? 'True' : 'False'); }
function analyze(A) {
  const R = {}, st = id => A.items[id];
  R.p1 = 0; R.p1c = 0; R.p1b = 0;
  MC.forEach(i => { const a = st(i.id).ans; if (a == null) R.p1b++; else if (a === i.key) { R.p1 += 2; R.p1c++; } });
  R.p2 = 0; R.p2c = 0; R.p2w = 0; R.p2b = 0;
  TF.forEach(i => { const a = st(i.id).ans; if (a == null) R.p2b++; else if (a === i.key) { R.p2 += 1; R.p2c++; } else { R.p2 -= 0.5; R.p2w++; } });
  const e = A.essay;
  R.graded = gradedPrompt(A);
  R.bothWritten = hasText(e.A) && hasText(e.B);
  const marks = R.graded ? (A.rubric[R.graded] || []) : [];
  R.p3 = R.graded ? PROMPTS[R.graded].rubric.reduce((t, r, k) => t + (marks[k] ? r.pts : 0), 0) : 0;
  R.p3Scored = !R.graded || !!A.essayScored;
  R.auto = R.p1 + R.p2;
  R.total = R.auto + (R.p3Scored ? R.p3 : 0);
  R.changes = []; R.wr = 0; R.rw = 0; R.ww = 0; R.net = 0; R.cleared = 0;
  ITEMS.forEach(i => {
    const s = st(i.id);
    if (!s.firstSet) return;
    if (s.ans == null) { if (s.first != null) R.cleared++; return; }
    if (s.ans === s.first) return;
    const fr = s.first === i.key, to = s.ans === i.key;
    let kind = 'ww';
    if (!fr && to) { R.wr++; kind = 'wr'; } else if (fr && !to) { R.rw++; kind = 'rw'; } else R.ww++;
    const d = itemPoints(i, s.ans) - itemPoints(i, s.first);
    R.net += d;
    R.changes.push({ i, from: s.first, to: s.ans, kind, d });
  });
  R.conf = { sure: [0, 0], unsure: [0, 0], guess: [0, 0] }; R.answered = 0; R.rated = 0;
  ITEMS.forEach(i => { const s = st(i.id); if (s.ans == null) return; R.answered++; if (s.conf) { R.rated++; R.conf[s.conf][0]++; if (s.ans === i.key) R.conf[s.conf][1]++; } });
  R.elimItems = MC.filter(i => st(i.id).elimUsed);
  const ans = MC.filter(i => st(i.id).ans != null);
  R.elimN = ans.filter(i => st(i.id).elimUsed).length;
  R.elimRight = ans.filter(i => st(i.id).elimUsed && st(i.id).ans === i.key).length;
  R.noElimN = ans.filter(i => !st(i.id).elimUsed).length;
  R.noElimRight = ans.filter(i => !st(i.id).elimUsed && st(i.id).ans === i.key).length;
  R.struckKey = MC.filter(i => st(i.id).struckKey);
  R.returned = ITEMS.filter(i => st(i.id).firstLeftBlank && st(i.id).ans != null);
  let lng = { i: null, ms: 0 };
  ITEMS.forEach(i => { const m = st(i.id).maxStop; if (m > lng.ms) lng = { i, ms: m }; });
  R.longest = lng;
  R.blankEV = R.p1b * 0.5 + R.p2b * 0.25;
  return R;
}
function evalTactics(A, R) {
  const out = [];
  const add = (id, status, text, label) => out.push({ t: TMAP[id], status, text, label: label || STATUS_L[status] });
  const coached = A.mode === 'coached';
  { // 1 read
    let s = 'used'; const p = [];
    if (coached) {
      const f = INSTR.filter(q => A.instr.first[q.id] === true).length;
      p.push(`Instruction check: ${f} of ${INSTR.length} right on the first try.`);
      if (f < 3) s = 'partial';
    } else {
      p.push(`You spent ${fmtDur(A.phase.cover)} on the directions page.`);
      if (A.phase.cover < 20000) { s = 'partial'; p.push('A careful read usually takes about a minute.'); }
    }
    if (R.bothWritten) { s = 'partial'; p.push(`You wrote on both essay prompts, but only Prompt ${R.graded} counted.`); }
    else if (R.graded) p.push('You answered one essay prompt, as directed.');
    if (R.p2b > 0) { s = 'partial'; p.push(`You left ${R.p2b} true/false ${plural(R.p2b, 'item')} blank, although a guess averages +¼ point under these directions.`); }
    add('read', s, p.join(' '));
  }
  { // 2 plan
    if (!A.plan) add('plan', 'missed', 'You skipped the time plan. Thirty seconds of planning sets a checkpoint for each part.');
    else {
      const pl = A.plan;
      const over = ['p1', 'p2', 'p3'].filter(k => A.phase[k] > pl[k] * 60000 * 1.25 + 60000);
      let s = 'used', t = `Plan: Part I ${pl.p1}, Part II ${pl.p2}, Part III ${pl.p3}, review ${pl.review} min.`;
      if (over.length) { s = 'partial'; t += ` You ran well over on ${over.map(k => PHASE_LABEL[k]).join(' and ')}.`; }
      else t += ' Each part stayed near or under its plan.';
      if (pl.review === 0) { s = 'partial'; t += ' No review time was planned.'; }
      if (A.timeUp) { s = 'partial'; t += ' Time ran out before you handed in.'; }
      add('plan', s, t);
    }
  }
  { // 3 order
    const L = R.longest, n = R.returned.length;
    const unseen = ITEMS.filter(i => A.items[i.id].visits === 0).length + (A.essay.firstVisitAt == null ? 1 : 0);
    if (L.i && L.ms > 150000) add('order', n ? 'partial' : 'missed', `Your longest single stop was ${fmtDur(L.ms)} on item ${L.i.num}. ${n ? `You did skip and return to ${n} ${plural(n, 'item')}.` : 'Flagging it after a minute or two would have freed time for easier items.'}`);
    else if (unseen) add('order', 'partial', `You never reached ${unseen} ${plural(unseen, 'item')}${A.essay.firstVisitAt == null ? ', including the essay' : ''}. A quick first pass through every part shows where the easy points are before time runs short.`);
    else if (n) add('order', 'used', `You skipped ${n} ${plural(n, 'item')} on your first pass and came back to answer ${n === 1 ? 'it' : 'them'}.`);
    else add('order', 'used', `No item held you for more than ${fmtDur(Math.max(L.ms, 1000))}, so nothing needed skipping.`);
  }
  { // 4 verbs
    if (!R.graded) add('verbs', 'missed', 'No essay response, so no prompt was decoded.');
    else {
      const P = PROMPTS[R.graded], ps = A.essay[R.graded], tk = toks(P.text), sel = new Set(ps.sel);
      const found = P.verbIdx.filter(k => sel.has(k)), miss = P.verbIdx.filter(k => !sel.has(k));
      const nm = k => { const w = tk[k].replace(/[^A-Za-z-]/g, ''); return w.charAt(0).toUpperCase() + w.slice(1); };
      const s = found.length === P.verbIdx.length ? 'used' : found.length ? 'partial' : 'missed';
      add('verbs', s, `Prompt ${R.graded}: you circled ${found.length} of ${P.verbIdx.length} directive verbs.${miss.length ? ` Not circled: ${miss.map(nm).join(', ')}.` : ''}`);
    }
  }
  { // 5 outline
    if (!R.graded) add('outline', 'missed', 'No essay response.');
    else {
      const ps = A.essay[R.graded], ow = wc(ps.outline);
      const before = ps.outlineAt != null && (ps.answerAt == null || ps.outlineAt <= ps.answerAt);
      if (ow >= 8 && before) add('outline', 'used', `Outline: ${ow} words, started before your response.`);
      else if (ow > 0) add('outline', 'partial', `Outline: ${ow} ${plural(ow, 'word')}${before ? '' : ', started after your response'}.`);
      else add('outline', 'missed', 'No outline. Even five lines in order make the response easier to write.');
    }
  }
  { // 6 elim
    const n = R.elimItems.length;
    let t = `You ruled out options on ${n} of 10 multiple-choice items.`;
    if (R.elimN && R.noElimN) t += ` ${R.elimRight} of ${R.elimN} right when you ruled options out; ${R.noElimRight} of ${R.noElimN} without.`;
    if (R.struckKey.length) t += ` On ${plural(R.struckKey.length, 'item')} ${R.struckKey.map(i => i.num).join(', ')} you ruled out the correct answer at some point, so strike only what you can disprove.`;
    add('elim', n >= 3 ? 'used' : n ? 'partial' : 'missed', t);
  }
  { // 7 neg
    const q3 = A.items.q3, ok3 = q3.ans === IMAP.q3.key;
    const tk3 = toks(IMAP.q3.stem);
    const hlExcept = q3.hl.some(k => norm(tk3[k] || '') === 'except');
    const okTF = ['q12', 'q13', 'q15'].filter(id => A.items[id].ans === IMAP[id].key).length;
    const score = (ok3 ? 1 : 0) + okTF;
    add('neg', score === 4 ? 'used' : score >= 2 ? 'partial' : 'missed', `Item 3 (EXCEPT): ${ok3 ? 'right' : 'missed'}${hlExcept ? ', and you marked EXCEPT' : ''}. True/false items with an absolute word or a two-part claim: ${okTF} of 3 right.`);
  }
  { // 8 clues
    const q6 = A.items.q6, q9 = A.items.q9, ok = q6.ans === IMAP.q6.key;
    const after = q9.firstVisitAt != null && q6.ansAt != null && q6.ansAt > q9.firstVisitAt;
    if (ok) add('clues', 'used', `Item 6 right.${after ? ' You answered it after reading item 9, which defines proactive interference.' : ''}`);
    else add('clues', 'missed', 'Item 6 missed. Item 9 defines proactive interference as earlier learning disrupting newer learning. Sam’s case is the reverse: retroactive interference.');
  }
  { // 9 conf
    if (!R.rated) add('conf', 'missed', 'No confidence ratings. Rating as you go tells you where to spend review time.');
    else {
      const c = R.conf;
      const parts = [['Sure', 'sure'], ['Unsure', 'unsure'], ['Guess', 'guess']].filter(([, k]) => c[k][0]).map(([l, k]) => `${l}: ${c[k][1]} of ${c[k][0]} right`);
      add('conf', R.rated >= R.answered * 0.8 ? 'used' : 'partial', `Rated ${R.rated} of ${R.answered} answers. ${parts.join(' · ')}.`);
    }
  }
  { // 10 change
    const tot = R.wr + R.rw + R.ww;
    if (tot) add('change', 'used', `${tot} ${plural(tot, 'change')}: ${R.wr} wrong to right, ${R.rw} right to wrong, ${R.ww} wrong to wrong. Net ${R.net >= 0 ? '+' : ''}${num(R.net)} ${plural(Math.abs(R.net), 'point')}.`);
    else {
      const low = ITEMS.filter(i => { const s = A.items[i.id]; return s.ans != null && (s.conf === 'guess' || s.conf === 'unsure'); }).length;
      if (low) add('change', 'partial', `No answers changed. You marked ${low} ${plural(low, 'answer')} Unsure or Guess; those are the ones worth a second look.`);
      else add('change', 'na', 'No answers changed, and none were marked Unsure or Guess.');
    }
  }
  { // 11 blank
    const b = R.p1b + R.p2b;
    if (!b) add('blank', 'used', 'Every item has an answer.');
    else add('blank', 'missed', `${R.p1b} Part I and ${R.p2b} Part II ${plural(b, 'item')} left blank. Blind guesses would have averaged about +${num(R.blankEV)} ${plural(R.blankEV, 'point')}.`);
  }
  { // 12 reset
    const r = A.reset;
    if (r.reframed || r.wrote) add('reset', 'used', `You did the pre-exam reset${r.reframed && r.wrote ? ' (reframe and writing)' : r.wrote ? ' (writing)' : ' (reframe)'}.`);
    else add('reset', 'na', 'Skipped. This one is optional, and the evidence is mixed.', 'Optional');
  }
  return out;
}

/* ================= proctor bar ================= */
function paceHTML() {
  const A = S.A, k = phaseKey();
  if (!k) return '';
  if (k === 'cover' || k === 'plan') {
    return `<div class="pace-top"><span class="pace-label">Directions and planning</span><span class="pace-text">${fmtDur(A.phase.cover + A.phase.plan)} used</span></div>`;
  }
  const label = PHASE_LABEL[k];
  const used = A.phase[k];
  if (!A.plan) return `<div class="pace-top"><span class="pace-label">${label}</span><span class="pace-text">${fmtDur(used)} used · no plan</span></div>`;
  const plan = A.plan[k] * 60000;
  const pct = plan > 0 ? Math.min(100, used / plan * 100) : 100;
  const over = used > plan;
  return `<div class="pace-top"><span class="pace-label">${label} plan</span><span class="pace-text">${fmtDur(used)} / ${fmtDur(plan)}</span></div><div class="pace-bar" role="img" aria-label="${label}: ${fmtDur(used)} used of ${fmtDur(plan)} planned"><span class="pace-fill${over ? ' over' : ''}" style="width:${pct.toFixed(1)}%"></span></div>`;
}
function proctorHTML() {
  const A = S.A, coached = A.mode === 'coached', left = A.limit * 60000 - A.elapsed;

    <div class="pace" id="pace">${paceHTML()}</div>
    <div class="pb-actions">${coached ? `<button type="button" class="btn small" data-act="${A.paused ? 'resume' : 'pause'}" data-fk="pb-pause">${A.paused ? 'Resume' : 'Pause'}</button>` : ''}${S.view === 'exam' ? '<button type="button" class="btn small primary" data-act="review" data-fk="pb-review">Review &amp; hand in</button>' : ''}${S.view === 'library' ? '<button type="button" class="btn small primary" data-act="libBack">Back to the exam</button>' : ''}</div>
  </div>`;
}
function updateProctor() {
  const A = S.A;

  const left = A.limit * 60000 - A.elapsed;
  const t = $('#pb-time');

function planFbHTML() {

    else if (sum < basis) msgs.push(['warn', `${basis - sum} ${plural(basis - sum, 'minute')} unassigned. Add ${basis - sum === 1 ? 'it' : 'them'} to review or to a part.`]);
    else msgs.push(['ok', `Your plan uses all ${basis} minutes.`]);

    if (p.review === 0) msgs.push(['warn', 'No review time. A few minutes at the end let you revisit Guess and Unsure items, where changed answers tend to pay off.']);

    ps[f] = el.value;
    if (ps[f + 'At'] == null && el.value.trim()) ps[f + 'At'] = A.elapsed;
    if (el.value.trim()) {
      if (!e2.startedFirst) e2.startedFirst = p;
      else if (e2.startedFirst !== p && !e2.warnedBoth && A.mode === 'coached') {
        e2.warnedBoth = true;
        toast(`The directions say to answer one prompt. Only Prompt ${e2.startedFirst} will be graded.`, 'coach');
      }
    }
    const w = $('#wc-' + f + '-' + p); if (w) w.textContent = wc(el.value) + ' words';
    const c = document.querySelector('.cell[data-id="essay"]'); if (c) c.classList.toggle('done', essayHasAnswer());
    refreshSteps();
    persistSoon();
  }
});
document.addEventListener('submit', e => {
  if (e.target && e.target.id === 'setup-form') { e.preventDefault(); startSession(); }
});
document.addEventListener('visibilitychange', () => { if (document.hidden) { accumulate(); persist(); } });
window.addEventListener('pagehide', () => { accumulate(); persist(); });

/* ================= init ================= */
(function init() {
  const cur = load(LS_CUR, null);
  if (cur && cur.v === 1 && !cur.submitted && cur.items && cur.essay) S.saved = cur;
  const last = load(LS_LAST, null);
  if (last && last.v === 1 && last.submitted && last.items) S.last = last;
  if (location.hash === '#library') { S.libFrom = 'home'; S.view = 'library'; }
  render();
})();

})();
</script>
</body>
</html>
